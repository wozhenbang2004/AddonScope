name: Build prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or validate
        type: string
        required: true
        default: v0.3.0
      prerelease:
        description: Mark this as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate selected tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Validate tag syntax
        id: tag
        env:
          SELECTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['SELECTED_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Tag must have the form vMAJOR.MINOR.PATCH')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('tag=' + tag + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record checked commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify release
        env:
          SELECTED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python tools/build.py --output dist/release
          python tools/check_release.py --output dist/release --expect-tag "$SELECTED_TAG" --rebuild --restore-test
      - name: Install Linux host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
      - name: Fetch official Blender
        run: python tools/fetch_blender.py --platform linux-x64 --directory .blender --executable-file .blender/executable.txt
      - name: Validate release in Blender
        run: python tools/run_blender_checks.py --blender-file .blender/executable.txt --dist dist/release --output artifacts/ci
      - name: Preserve checked assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checked prerelease
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name release-assets --dir release-assets
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          IS_PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
        run: |
          python - <<'PY_CHECK'
          import json, os, subprocess
          repo = 'repos/' + os.environ['GH_REPO']
          def api(path, allow_missing=False):
              result = subprocess.run(['gh', 'api', path], capture_output=True, text=True)
              if result.returncode:
                  if allow_missing and '(HTTP 404)' in result.stderr:
                      return None
                  raise SystemExit(result.stderr)
              return json.loads(result.stdout)
          ref = api(repo + '/git/ref/tags/' + os.environ['RELEASE_TAG'], allow_missing=True)
          if ref is not None:
              target = ref['object']
              seen = set()
              while target['type'] == 'tag':
                  if target['sha'] in seen or len(seen) >= 16:
                      raise SystemExit('Invalid annotated tag chain; release refused.')
                  seen.add(target['sha'])
                  target = api(repo + '/git/tags/' + target['sha'])['object']
              if target['type'] != 'commit' or target['sha'] != os.environ['RELEASE_COMMIT']:
                  raise SystemExit('The existing tag points to a different commit; release refused.')
          PY_CHECK
          flags=()
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS --target "$RELEASE_COMMIT" "${flags[@]}" --title "AddonScope $RELEASE_TAG" --generate-notes
