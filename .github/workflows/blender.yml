name: Blender integration

on:
  workflow_call:
    inputs:
      all_platforms:
        description: Also run Windows x64 and macOS ARM64
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also run Windows x64 and macOS ARM64
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  integration:
    name: Blender 4.5.15 / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.all_platforms && '[{"os":"ubuntu-24.04","platform":"linux-x64"},{"os":"windows-2022","platform":"windows-x64"},{"os":"macos-15","platform":"macos-arm64"}]' || '[{"os":"ubuntu-24.04","platform":"linux-x64"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Linux host libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
      - name: Download and verify the official Blender host
        run: python tools/fetch_blender.py --platform ${{ matrix.platform }} --directory .blender --executable-file .blender/executable.txt
      - name: Build extension
        run: python tools/build.py
      - name: Run actual host integration
        run: python tools/run_blender_checks.py --blender-file .blender/executable.txt --output artifacts/ci
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blender-${{ matrix.platform }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
